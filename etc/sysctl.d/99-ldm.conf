# /etc/sysctl.d/99-ldm.conf
# LDM-OS Runtime Configuration
# Apply: sysctl -p /etc/sysctl.d/99-ldm.conf

# === Global Control ===
# Enable/disable LDM subsystem (0=off, 1=on)
vm.ldm_enabled = 1

# Operating mode: 0=off, 1=compat(transparent), 2=native(explicit API), 3=aggressive
vm.ldm_mode = 1

# === Thresholds (bytes) ===
# Use zero-copy for transfers above this size
vm.ldm_zerocopy_threshold = 65536

# Use non-temporal stores above this size
vm.ldm_nt_threshold = 262144

# Use batch operations above this size
vm.ldm_batch_threshold = 1048576

# Pages threshold for lazy COW during fork
vm.ldm_cow_fork_threshold = 4096

# === Feature Toggles ===
# Lazy page zeroing (zero on first access instead of eager memset)
vm.ldm_lazy_zero_enabled = 1

# Lazy copy-on-write (defer physical copy until actual write)
vm.ldm_lazy_cow_enabled = 1

# Cache affinity (keep hot pages in LLC longer)
vm.ldm_cache_affinity_enabled = 1

# IOMMU mode: 0=disabled, 1=software-simulated, 2=hardware
vm.ldm_iommu_mode = 1

# === Resource Limits ===
# Maximum anchored pages per process
vm.ldm_anchor_max_pages = 65536

# Memory pressure threshold for eviction (%)
vm.ldm_eviction_pressure_pct = 80

# === Monitoring ===
# Statistics refresh interval (milliseconds)
vm.ldm_stats_interval_ms = 1000

# Debug level: 0=off, 1=warnings, 2=info, 3=trace
vm.ldm_debug_level = 0
