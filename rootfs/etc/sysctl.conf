# Kernel debugging
kernel.printk = 8 8 1 8
kernel.panic = 0
kernel.panic_on_oops = 1
kernel.hung_task_timeout_secs = 120
kernel.softlockup_panic = 0
kernel.watchdog = 1

# Memory debugging
vm.panic_on_oom = 0
vm.oom_kill_allocating_task = 1

# Network debugging
net.core.netdev_max_backlog = 5000
net.ipv4.tcp_retries2 = 5
